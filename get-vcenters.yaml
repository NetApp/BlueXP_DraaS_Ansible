---
- name: Make HTTP GET request to fetch vcenters
  hosts: localhost
  gather_facts: no
  vars_files:
    - vars/env/extravars

  tasks:
    - name: Fetch sites
      uri:
        url: "https://snapcenter.cloudmanager.cloud.netapp.com/api/vmdr/vcenters?"
        method: get
        return_content: yes
        headers:
          Content-Type: "application/json"  
          x-agent-id: "{{ agentid }}" 
          Authorization: "{{ authorization }}"
          x-account-id: "{{ accountid }}"
      register: result

    - name: Print the fetched vcenters
      debug:
        var: result.json


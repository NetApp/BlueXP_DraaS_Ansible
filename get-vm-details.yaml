---
- name: Make HTTP GET request to fetch VMs in a vcenter
  hosts: localhost
  gather_facts: no
  vars_files:
    - vars/main.yaml

  tasks:
    - name: Fetch Vms
      uri:
        url: "https://snapcenter.cloudmanager.cloud.netapp.com/api/vmdr/vcenters/{{ vcenterid }}/virtual-machines/{{ vmid }}"
        method: get
        return_content: yes
        headers:
          Content-Type: "application/json"  
          x-agent-id: "{{ agentid }}" 
          Authorization: "{{ authorization }}"
          x-account-id: "{{ accountid }}"
      register: result

    - name: Print the fetched VM
      debug:
        var: result.json

